# Build iOS en la nube (EAS) — requiere secretos en GitHub

name: Lunera iOS (EAS)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "app.json"
      - "eas.json"
      - "src/**"
      - "package.json"

jobs:
  build-ios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS (TestFlight)
        run: eas build --platform ios --profile preview --non-interactive --no-wait
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Submit to TestFlight (optional)
        if: ${{ vars.EAS_SUBMIT_IOS == 'true' }}
        run: eas submit --platform ios --latest --non-interactive
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
