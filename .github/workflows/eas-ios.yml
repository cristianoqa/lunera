# Build iOS en la nube (EAS) — requiere secretos en GitHub
#
# Secrets (Settings → Secrets and variables → Actions):
#   EXPO_TOKEN                      (obligatorio)  expo.dev → Account → Access tokens
#   EXPO_APPLE_APP_SPECIFIC_PASSWORD (opcional)    solo si vars.EAS_SUBMIT_IOS == 'true'
#
# Variables:
#   EAS_SUBMIT_IOS = 'true'  para auto-submit a TestFlight tras el build

name: Lunera iOS (EAS)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "app.json"
      - "eas.json"
      - "src/**"
      - "package.json"
      - ".github/workflows/eas-ios.yml"

jobs:
  build-ios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Falta el secreto EXPO_TOKEN en este repo (Settings → Secrets → Actions)."
            echo "Crea un token en https://expo.dev/settings/access-tokens y añádelo como EXPO_TOKEN."
            echo "Sin él, EAS no puede autenticarse (el paso Setup EAS falla con yarn/exit 1)."
            exit 1
          fi

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS (TestFlight)
        run: eas build --platform ios --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Submit to TestFlight (optional)
        if: ${{ vars.EAS_SUBMIT_IOS == 'true' }}
        run: eas submit --platform ios --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
